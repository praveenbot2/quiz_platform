<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Monitoring & Prediction System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🏥 AI Health Monitoring & Prediction System</h1>
            <p class="subtitle">Real-time health monitoring powered by artificial intelligence</p>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="showTab('register')">Register Patient</button>
            <button class="tab-btn" onclick="showTab('vitals')">Record Vitals</button>
            <button class="tab-btn" onclick="showTab('symptoms')">Check Symptoms</button>
            <button class="tab-btn" onclick="showTab('monitor')">Monitor Patient</button>
            <button class="tab-btn" onclick="showTab('patients')">Patient List</button>
        </nav>

        <!-- Register Patient Tab -->
        <div id="register" class="tab-content active">
            <h2>Register New Patient</h2>
            <form id="registerForm" class="form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age *</label>
                        <input type="number" id="age" name="age" min="0" max="150" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="blood_group">Blood Group</label>
                        <select id="blood_group" name="blood_group">
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="2"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="medical_history">Medical History</label>
                    <textarea id="medical_history" name="medical_history" rows="3" 
                              placeholder="Previous conditions, allergies, medications..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">Register Patient</button>
            </form>
            <div id="registerMessage" class="message"></div>
        </div>

        <!-- Record Vitals Tab -->
        <div id="vitals" class="tab-content">
            <h2>Record Patient Vitals</h2>
            <form id="vitalsForm" class="form">
                <div class="form-group">
                    <label for="vitals_patient_id">Select Patient *</label>
                    <select id="vitals_patient_id" name="patient_id" required>
                        <option value="">Loading patients...</option>
                    </select>
                </div>
                
                <h3>Vital Signs</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="heart_rate">Heart Rate (bpm)</label>
                        <input type="number" id="heart_rate" name="heart_rate" step="0.1" placeholder="75">
                    </div>
                    <div class="form-group">
                        <label for="temperature">Temperature (°C)</label>
                        <input type="number" id="temperature" name="temperature" step="0.1" placeholder="37.0">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="bp_systolic">BP Systolic (mmHg)</label>
                        <input type="number" id="bp_systolic" name="blood_pressure_systolic" step="0.1" placeholder="120">
                    </div>
                    <div class="form-group">
                        <label for="bp_diastolic">BP Diastolic (mmHg)</label>
                        <input type="number" id="bp_diastolic" name="blood_pressure_diastolic" step="0.1" placeholder="80">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="oxygen_saturation">Oxygen Saturation (%)</label>
                        <input type="number" id="oxygen_saturation" name="oxygen_saturation" step="0.1" placeholder="98">
                    </div>
                    <div class="form-group">
                        <label for="respiratory_rate">Respiratory Rate (breaths/min)</label>
                        <input type="number" id="respiratory_rate" name="respiratory_rate" step="0.1" placeholder="16">
                    </div>
                </div>
                
                <h3>Additional Metrics</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="weight">Weight (kg)</label>
                        <input type="number" id="weight" name="weight" step="0.1" placeholder="70">
                    </div>
                    <div class="form-group">
                        <label for="height">Height (cm)</label>
                        <input type="number" id="height" name="height" step="0.1" placeholder="170">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="blood_glucose">Blood Glucose (mg/dL)</label>
                    <input type="number" id="blood_glucose" name="blood_glucose" step="0.1" placeholder="100">
                </div>
                
                <div class="form-group">
                    <label for="vitals_symptoms">Symptoms</label>
                    <textarea id="vitals_symptoms" name="symptoms" rows="2" 
                              placeholder="Describe any symptoms..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="2" 
                              placeholder="Additional notes..."></textarea>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Record Vitals</button>
                    <button type="button" class="btn btn-secondary" onclick="analyzeVitals()">Analyze & Predict Risk</button>
                </div>
            </form>
            <div id="vitalsMessage" class="message"></div>
            <div id="vitalsAnalysis" class="analysis-results"></div>
        </div>

        <!-- Check Symptoms Tab -->
        <div id="symptoms" class="tab-content">
            <h2>Check Symptoms for Disease Prediction</h2>
            <form id="symptomsForm" class="form">
                <div class="form-group">
                    <label for="symptoms_patient_id">Select Patient *</label>
                    <select id="symptoms_patient_id" name="patient_id" required>
                        <option value="">Loading patients...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Select Symptoms *</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" name="symptom" value="fever"> Fever</label>
                        <label><input type="checkbox" name="symptom" value="cough"> Cough</label>
                        <label><input type="checkbox" name="symptom" value="fatigue"> Fatigue</label>
                        <label><input type="checkbox" name="symptom" value="difficulty_breathing"> Difficulty Breathing</label>
                        <label><input type="checkbox" name="symptom" value="headache"> Headache</label>
                        <label><input type="checkbox" name="symptom" value="sore_throat"> Sore Throat</label>
                        <label><input type="checkbox" name="symptom" value="body_ache"> Body Ache</label>
                        <label><input type="checkbox" name="symptom" value="nausea"> Nausea</label>
                        <label><input type="checkbox" name="symptom" value="vomiting"> Vomiting</label>
                        <label><input type="checkbox" name="symptom" value="diarrhea"> Diarrhea</label>
                        <label><input type="checkbox" name="symptom" value="chest_pain"> Chest Pain</label>
                        <label><input type="checkbox" name="symptom" value="dizziness"> Dizziness</label>
                        <label><input type="checkbox" name="symptom" value="loss_of_taste"> Loss of Taste</label>
                        <label><input type="checkbox" name="symptom" value="loss_of_smell"> Loss of Smell</label>
                        <label><input type="checkbox" name="symptom" value="runny_nose"> Runny Nose</label>
                        <label><input type="checkbox" name="symptom" value="rash"> Rash</label>
                        <label><input type="checkbox" name="symptom" value="abdominal_pain"> Abdominal Pain</label>
                        <label><input type="checkbox" name="symptom" value="chills"> Chills</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Predict Disease</button>
            </form>
            <div id="symptomsMessage" class="message"></div>
            <div id="diseaseResults" class="analysis-results"></div>
        </div>

        <!-- Monitor Patient Tab -->
        <div id="monitor" class="tab-content">
            <h2>Real-Time Patient Monitoring</h2>
            <div class="form-group">
                <label for="monitor_patient_id">Select Patient to Monitor</label>
                <select id="monitor_patient_id" onchange="loadMonitoringData()">
                    <option value="">Loading patients...</option>
                </select>
            </div>
            <div id="monitoringDashboard"></div>
        </div>

        <!-- Patient List Tab -->
        <div id="patients" class="tab-content">
            <h2>Registered Patients</h2>
            <button class="btn btn-secondary" onclick="loadPatientsList()">Refresh List</button>
            <div id="patientsList"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
